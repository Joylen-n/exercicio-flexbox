<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Flexbox</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body {
            background-color: #0b1a26;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            font-family: Arial, sans-serif;
            justify-content: center;
        }
        .quadrado {
            width: 250px;
            height: 250px;
            background-color: #162f46;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
        }
        .caixinha {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin: 2px;
        }
        .c1 { background-color: #90c2ff; }
        .c2 { background-color: #5599ed; }
        .c3 { background-color: #2b77d2; }
        .c4 { background-color: #1a5c9e; }
    </style>
</head>
<body>
    <div class="quadrado quadrado-1">
        <div class="caixinha c1"></div><div class="caixinha c2"></div><div class="caixinha c3"></div><div class="caixinha c4"></div>
    </div>
    <div class="quadrado quadrado-2">
        <div class="caixinha c1"></div><div class="caixinha c2"></div><div class="caixinha c3"></div><div class="caixinha c4"></div>

    </div>

    </div>
    <div class="quadrado quadrado-5">
        <div class="caixinha c1"></div><div class="caixinha c2"></div><div class="caixinha c3"></div><div class="caixinha c4"></div>
    </div>
    <div class="quadrado quadrado-6">
        <div class="caixinha c1"></div><div class="caixinha c2"></div><div class="caixinha c3"></div><div class="caixinha c4"></div>
    </div>
    <div class="quadrado quadrado-7">

</html>
